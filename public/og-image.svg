<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">AllTools AI — One workspace for your tools</title><desc id="desc">A premium charcoal and lime brand graphic introducing the unified workspace for AI, knowledge, creative, developer, and automation tools.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101510"/><stop offset="1" stop-color="#202820"/></linearGradient><radialGradient id="glow"><stop stop-color="#D7F36C" stop-opacity=".18"/><stop offset="1" stop-color="#D7F36C" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><circle cx="970" cy="240" r="390" fill="url(#glow)"/><g transform="translate(88 86)"><rect width="62" height="62" rx="17" fill="#D7F36C"/><path d="M16 45 29.4 17.5c1.1-2.3 4.1-2.3 5.2 0L48 45M23.5 35.5h17" fill="none" stroke="#20251F" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><text x="82" y="42" fill="#F5F6F0" font-family="Manrope,Arial,sans-serif" font-size="34" font-weight="800">alltools<tspan fill="#D7F36C">.ai</tspan></text></g><text x="88" y="280" fill="#F5F6F0" font-family="Manrope,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2">One workspace.</text><text x="88" y="355" fill="#D7F36C" font-family="Manrope,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2">More ways to build.</text><text x="91" y="418" fill="#C4CCBD" font-family="Arial,sans-serif" font-size="24">AI · Knowledge · Creative · Developer · Automation</text><path d="M90 490h1020" stroke="#FFFFFF" stroke-opacity=".14"/><text x="90" y="538" fill="#9AA592" font-family="Arial,sans-serif" font-size="19">A unified workspace for the tools behind your work.</text><g transform="translate(978 450)" opacity=".95"><rect width="104" height="104" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".12"/><path d="M27 72 47 30c1.8-3.8 7.2